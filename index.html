<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PanL - Debate Companion</title>
    <style>
        :root {
            --bg-main: #f8f9fa;
            --card-bg: #ffffff;
            --blue: #4a90e2;
            --green: #2ecc71;
            --red: #e74c3c;
            --yellow: #f1c40f;
            --text-dark: #333;
            --text-muted: #777;
            --shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* Removes blue highlight on tap */
            outline: none;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            height: 100vh;
            transition: background-color 0.4s ease;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hidden { display: none !important; }

        /* Branding */
        .header { text-align: center; margin-top: 40px; margin-bottom: 40px; }
        .logo-box {
            background: #eef2ff;
            width: 80px; height: 80px;
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 15px;
        }
        .logo-box svg { width: 40px; height: 40px; fill: var(--blue); }
        .header h1 { margin: 0; font-size: 2.2rem; font-weight: 800; }
        .header p { color: var(--text-muted); margin-top: 8px; font-size: 0.95rem; }

        /* Menu Cards */
        .card {
            background: var(--card-bg);
            width: 100%;
            padding: 24px;
            border-radius: 24px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            box-shadow: var(--shadow);
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.02);
            transition: transform 0.1s;
        }
        .card:active { transform: scale(0.97); }
        .card-icon {
            width: 54px; height: 54px;
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            margin-right: 16px;
        }
        .green-icon { background: #e8f8f0; fill: var(--green); }
        .blue-icon { background: #eef2ff; fill: var(--blue); }
        .card-content h3 { margin: 0; font-size: 1.2rem; }
        .card-content p { margin: 4px 0 0; font-size: 0.9rem; color: var(--text-muted); line-height: 1.4; }
        .arrow-svg { margin-left: auto; fill: #ccd0d5; width: 20px; }

        /* Timer View */
        .back-nav { align-self: flex-start; background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 10px 0; font-size: 1rem; display: flex; align-items: center; gap: 5px; }
        .view-title { margin: 15px 0; font-weight: 700; font-size: 1.6rem; }
        
        .timer-wrapper {
            position: relative;
            width: 300px; height: 300px;
            margin: 20px 0;
        }
        .progress-ring { transform: rotate(-90deg); }
        .progress-ring__circle { fill: transparent; stroke: #eaedf0; stroke-width: 10; }
        .progress-ring__bar {
            fill: transparent;
            stroke-width: 10;
            stroke-dasharray: 816.8; /* 2 * PI * 130 */
            stroke-dashoffset: 816.8;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s linear, stroke 0.3s;
        }

        .timer-display {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5rem;
            font-weight: 800;
            letter-spacing: -2px;
            font-variant-numeric: tabular-nums;
        }

        /* Controls */
        .controls { display: flex; gap: 15px; margin-top: 30px; width: 100%; }
        .pill-btn {
            flex: 1;
            background: #ffffff;
            border: 1px solid #eee;
            padding: 16px;
            border-radius: 50px;
            font-weight: 700;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            font-size: 1rem;
        }
        .pill-btn svg { width: 20px; fill: currentColor; }
        
        .poi-btn-active { background: var(--yellow) !important; color: #000; border-color: transparent; }
        .poi-btn-disabled { opacity: 0.3; cursor: not-allowed; }

        .restart-btn {
            margin-top: 40px;
            background: #eee;
            border: none;
            width: 50px; height: 50px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .restart-btn:active { background: #ddd; transform: rotate(-45deg); }
        .restart-btn svg { width: 24px; fill: #555; }
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- Home Screen -->
    <div id="home-screen" class="screen">
        <div class="header">
            <div class="logo-box">
                <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
            </div>
            <h1>PanL</h1>
            <p>Your companion for debates & speeches</p>
        </div>

        <div class="card" onclick="openMode('debate')">
            <div class="card-icon green-icon">
                <svg viewBox="0 0 24 24" width="30"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
            </div>
            <div class="card-content">
                <h3>Debate</h3>
                <p>7-minute format with POI support</p>
            </div>
            <svg class="arrow-svg" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
        </div>

        <div class="card" onclick="openMode('speaking')">
            <div class="card-icon blue-icon">
                <svg viewBox="0 0 24 24" width="30"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
            </div>
            <div class="card-content">
                <h3>Public Speaking</h3>
                <p>Simple 3-minute countdown</p>
            </div>
            <svg class="arrow-svg" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
        </div>
    </div>

    <!-- Timer Screen -->
    <div id="timer-screen" class="screen hidden" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <button class="back-nav" onclick="goBack()">
            <svg viewBox="0 0 24 24" width="20" fill="currentColor"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg> Back
        </button>
        <div class="view-title" id="mode-title">Debate</div>

        <div class="timer-wrapper">
            <svg class="progress-ring" width="300" height="300">
                <circle class="progress-ring__circle" cx="150" cy="150" r="130" />
                <circle id="bar" class="progress-ring__bar" cx="150" cy="150" r="130" />
            </svg>
            <div id="time-text" class="timer-display">0:00</div>
        </div>

        <div class="controls">
            <button class="pill-btn" onclick="toggleTimer()">
                <svg id="play-pause-icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                <span id="pause-text">Start</span>
            </button>
            <button id="poi-btn-control" class="pill-btn" onclick="triggerPOI()">
                <svg viewBox="0 0 24 24"><path d="M13 1c-4.97 0-9 4.03-9 9v7c0 1.66 1.34 3 3 3h1v2c0 1.1.9 2 2 2h4c1.1 0 2-.9 2-2v-2h1c1.66 0 3-1.34 3-3V10c0-4.97-4.03-9-9-9z"/></svg>
                POI
            </button>
        </div>

        <button class="restart-btn" onclick="resetTimer()" title="Restart">
            <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
    </div>
</div>

<script>
    let currentMode = '';
    let seconds = 0;
    let timer = null;
    let isRunning = false;
    let poiActive = false;
    let poiTimeLeft = 0;

    const bar = document.getElementById('bar');
    const circumference = 2 * Math.PI * 130;
    bar.style.strokeDasharray = `${circumference} ${circumference}`;

    function ring() {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const playTone = (freq, vol, decay) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.frequency.setValueAtTime(freq, ctx.currentTime);
            gain.gain.setValueAtTime(vol, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + decay);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + decay);
        };
        playTone(880, 0.3, 1.2);
        playTone(1760, 0.1, 0.8);
    }

    function setProgress(percent, color) {
        const offset = circumference - (percent * circumference);
        bar.style.strokeDashoffset = offset;
        bar.style.stroke = color;
        document.getElementById('time-text').style.color = color;
    }

    function openMode(mode) {
        currentMode = mode;
        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById('timer-screen').classList.remove('hidden');
        document.getElementById('mode-title').innerText = mode === 'debate' ? 'Debate' : 'Public Speaking';
        document.getElementById('poi-btn-control').style.display = mode === 'debate' ? 'flex' : 'none';
        resetTimer();
    }

    function goBack() {
        clearInterval(timer);
        document.getElementById('home-screen').classList.remove('hidden');
        document.getElementById('timer-screen').classList.add('hidden');
        document.body.style.backgroundColor = 'var(--bg-main)';
    }

    function toggleTimer() {
        isRunning = !isRunning;
        document.getElementById('pause-text').innerText = isRunning ? 'Pause' : 'Resume';
        const icon = document.getElementById('play-pause-icon');
        icon.innerHTML = isRunning ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
        
        if (isRunning && !timer) {
            timer = setInterval(tick, 1000);
        } else if (!isRunning) {
            clearInterval(timer);
            timer = null;
        }
    }

    function resetTimer() {
        clearInterval(timer);
        timer = null;
        isRunning = false;
        poiActive = false;
        seconds = currentMode === 'debate' ? 0 : 180;
        document.getElementById('pause-text').innerText = 'Start';
        document.getElementById('play-pause-icon').innerHTML = '<path d="M8 5v14l11-7z"/>';
        updateUI();
    }

    function triggerPOI() {
        if (currentMode !== 'debate') return;
        const mins = Math.floor(seconds / 60);
        if (mins === 0 || mins >= 6) return;

        if (poiActive) {
            poiActive = false;
        } else {
            poiActive = true;
            poiTimeLeft = 15;
        }
        updateUI();
    }

    function tick() {
        if (currentMode === 'debate') {
            seconds++;
            if ([60, 360, 420, 435].includes(seconds)) ring();
        } else {
            seconds--;
            if (seconds === 0) { ring(); clearInterval(timer); isRunning = false; }
        }

        if (poiActive) {
            poiTimeLeft--;
            if (poiTimeLeft <= 0) { ring(); poiActive = false; }
        }
        updateUI();
    }

    function updateUI() {
        const m = Math.floor(Math.abs(seconds) / 60);
        const s = Math.abs(seconds) % 60;
        document.getElementById('time-text').innerText = `${m}:${s.toString().padStart(2, '0')}`;

        let color = 'var(--blue)';
        let percent = 1;

        if (currentMode === 'speaking') {
            percent = seconds / 180;
        } else {
            percent = seconds / 420;
            if (seconds < 60) color = 'var(--green)';
            else if (seconds < 360) color = 'var(--blue)';
            else if (seconds < 420) color = 'var(--red)';
            else color = '#000000';
            
            const canPOI = (Math.floor(seconds / 60) > 0 && Math.floor(seconds / 60) < 6);
            const poiBtn = document.getElementById('poi-btn-control');
            poiBtn.className = `pill-btn ${!canPOI ? 'poi-btn-disabled' : ''} ${poiActive ? 'poi-btn-active' : ''}`;
        }

        if (poiActive) {
            document.body.style.backgroundColor = 'var(--yellow)';
            setProgress(percent, '#000');
        } else {
            document.body.style.backgroundColor = 'var(--bg-main)';
            setProgress(percent, color);
        }
    }
</script>
</body>
</html>
